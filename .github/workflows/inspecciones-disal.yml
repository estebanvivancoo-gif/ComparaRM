name: Generar Inspecciones DISAL APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'InspeccionesDISAL/**'
      - '.github/workflows/inspecciones-disal.yml'
permissions:
  contents: read
jobs:
  build-disal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar administrador Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Instalar SDK Android 35
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Aplicar interfaz de terreno v0.2
        run: python3 InspeccionesDISAL/ux_v02.py
      - name: Aplicar mejoras v0.3 REAS BCN y seguimiento
        run: python3 InspeccionesDISAL/ux_v03.py
      - name: Aplicar estilo HUD cyberpunk v0.4
        run: python3 InspeccionesDISAL/ux_v04.py
      - name: Aplicar mejoras ejecutivas v0.5
        run: python3 InspeccionesDISAL/ux_v05.py
      - name: Incorporar reuniones CPHS y visitas técnicas v0.6
        run: python3 InspeccionesDISAL/ux_v06.py
      - name: Compilar APK de inspecciones
        working-directory: InspeccionesDISAL
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Adjuntar APK
        uses: actions/upload-artifact@v4
        with:
          name: Inspecciones-DISAL-APK
          path: InspeccionesDISAL/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Adjuntar código fuente
        run: zip -qr InspeccionesDISAL-codigo.zip InspeccionesDISAL -x '*/build/*' '*/.gradle/*'
      - name: Publicar código fuente
        uses: actions/upload-artifact@v4
        with:
          name: Inspecciones-DISAL-Codigo
          path: InspeccionesDISAL-codigo.zip
