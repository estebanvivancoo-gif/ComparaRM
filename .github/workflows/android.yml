name: Generar ComparaRM APK
on:
  push:
    branches: [main]
    paths:
      - 'ComparaRM_v0.1_Android.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Comprobar y extraer proyecto
        shell: bash
        run: |
          test -f ComparaRM_v0.1_Android.zip || { echo "::error::Falta ComparaRM_v0.1_Android.zip en la raiz del repositorio"; exit 1; }
          unzip -q ComparaRM_v0.1_Android.zip
          test -f ComparaRM_v0.1/app/build.gradle
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Utilizar Android SDK incluido en el runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar y firmar APK de prueba
        working-directory: ComparaRM_v0.1
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: ComparaRM-APK-Android
          path: ComparaRM_v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
