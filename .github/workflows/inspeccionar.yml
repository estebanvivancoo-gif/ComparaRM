name: Analizar catalogos estructurados
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspeccionar.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extraer muestras de catalogos
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,re,urllib.parse,collections
          urls={
            'Lider':'https://super.lider.cl/search?query=leche',
            'Mayorista10':'https://www.mayorista10.cl',
            'aCuenta':'https://www.acuenta.cl'
          }
          for store,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=15) as resp:
                html=resp.read(4_000_000).decode('utf-8','replace')
                print('STORE',store,'URL',resp.url,'HTML_LENGTH',len(html))
              match=re.search(r'<script[^>]*id=["\\x27]__NEXT_DATA__["\\x27][^>]*>(.*?)</script>',html,re.S)
              if not match:
                print('NO_NEXT_DATA',store);continue
              obj=json.loads(match.group(1))
              print('ROOT',store,list(obj.keys()),'pageProps',list(obj.get('props',{}).get('pageProps',{}).keys())[:30])
              def walk(node,level=0,path='root'):
                if level>12:return
                if isinstance(node,list):
                  if node and isinstance(node[0],dict):
                    item=node[0]
                    hints={'price','name','productId','displayName','__typename','productName','linePrice','sellingPrice','amount','shortDescription'}
                    if len(hints.intersection(item.keys()))>=2 or item.get('__typename')=='Product':
                      print('ARRAY',store,path,'count',len(node),'keys',list(item.keys())[:20],'sample',json.dumps(item,ensure_ascii=False)[:500])
                  for i,entry in enumerate(node[:3]):walk(entry,level+1,path+f'[{i}]')
                if isinstance(node,dict):
                  for key,value in node.items():
                    if key in ('priceInfo','prices','availableProducts','offers') and isinstance(value,(dict,list)):
                      print('PRICE_FIELD',store,path+'.'+key,repr(value)[:300])
                    if isinstance(value,(dict,list)):walk(value,level+1,path+'.'+key)
              walk(obj)
            except Exception as e: print('ERROR',store,repr(e))
          PY
