name: Diagnosticar cobertura de siete supermercados
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/cobertura.yml']
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Consultar fuentes publicas sin autenticar ni eludir bloqueos
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json
          tests={
           'Unimarc BFF':('https://bff-unimarc-ecommerce.unimarc.cl/catalog/product/search',{'from':'0','to':'4','searching':'leche','promotionsOnly':False,'orderBy':'','userTriggered':True},{'channel':'UNIMARC','source':'web','version':'1.0.0'}),
           'Unimarc VTEX':('https://www.unimarc.cl/api/catalog_system/pub/products/search/leche?_from=0&_to=4',None,{}),
           'Tottus web':('https://www.tottus.cl/tottus-cl/buscar?Ntt=leche',None,{}),
           'Lider web':('https://super.lider.cl/search?query=leche',None,{}),
           'aCuenta web':('https://acuenta.cl',None,{}),
           'Mayorista10 ofertas':('https://www.mayorista10.cl/',None,{})
          }
          for name,(url,payload,headers) in tests.items():
           try:
            data=json.dumps(payload).encode() if payload is not None else None
            h={'User-Agent':'ComparaRM/0.3 (public price-source availability check)','Accept':'application/json, text/html;q=0.9',**headers}
            if data: h['Content-Type']='application/json'
            with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h),timeout=15) as resp:
             body=resp.read(700000).decode('utf-8','replace')
             print('TEST',name,'HTTP',resp.status,'BYTES',len(body),'JSON',body[:1]=='{','NEXT_DATA','__NEXT_DATA__' in body,'CLP','$' in body)
             if 'Unimarc BFF'==name:
              try:
               d=json.loads(body)
               p=d.get('availableProducts',[])
               print('PRODUCTS',len(p),'SAMPLE',[(x.get('item',{}).get('name'),x.get('price',{}).get('price')) for x in p[:2]])
              except Exception as ex: print('PARSE_ERROR',repr(ex))
           except Exception as ex:print('TEST',name,'ERROR',str(ex)[:180])
          PY
